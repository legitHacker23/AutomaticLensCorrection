# ── data ──────────────────────────────────────────────────────────────
data:
  train_dir: "data/train"
  test_dir: "data/test"
  val_ratio: 0.05
  num_workers: 8

# ── training stage 1 ─────────────────────────────────────────────────
train:
  image_size: 256
  batch_size: 16
  epochs: 7
  lr: 2.0e-4
  amp: true
  freeze_encoder_epochs: 3

# ── training stage 2 (finetune) ─────────────────────────────────────
finetune:
  image_size: 384
  batch_size: 8
  epochs: 3
  lr: 5.0e-5
  amp: true
  freeze_encoder_epochs: 0

# ── loss weights ─────────────────────────────────────────────────────
loss:
  w_l1: 0.5
  w_grad: 2.0
  w_ssim: 1.0
  w_tv: 0.1
  w_bend: 0.05

# ── model ────────────────────────────────────────────────────────────
model:
  backbone: "resnet34"
  flow_channels: 64
  grid_sample_mode: "bicubic"
  grid_sample_padding: "border"
  align_corners: true

# ── inference ────────────────────────────────────────────────────────
infer:
  checkpoint: "checkpoints/best.pt"
  output_dir: "output"
  full_res: true

# ── checkpointing ────────────────────────────────────────────────────
checkpoint:
  dir: "checkpoints"
  save_every: 1
